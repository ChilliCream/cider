name: E2E

run-name: E2E ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # cider-5ve: fail fast when the runner cannot virtualize at all, BEFORE the expensive matrix
  # spins up. GitHub-hosted macos-15 runners are themselves VMs on Apple Silicon with no nested
  # virtualization, so Apple `container` can never boot a VM there — every bootstrap dies with
  # VZErrorDomain Code=2 "Virtualization is not available on this hardware" and the matrix
  # cascades red over ~10 minutes. This probe turns that into one ~30-second red with the real
  # reason.
  #
  # Probe choice: `sysctl -n kern.hv.supported` (the Apple Silicon Hypervisor.framework
  # capability sysctl; `kern.hv_support` is its legacy alias). Virtualization.framework — which
  # `container` uses to boot its VMs — is built on Hypervisor.framework, so hv support is a
  # necessary precondition and this passive read reflects exactly the capability that fails with
  # VZErrorDomain Code=2. It reads 1 on bare-metal Apple Silicon (verified locally) and 0 inside
  # GitHub's non-nested runner VMs. Chosen over the ticket's alternative (`container system
  # start` + a trivial `container run` under a timeout) because it is instant, has no install
  # step, and cannot itself hang.
  #
  # Deliberately FAILS RED rather than skip-green: a suite that cannot run is not a pass
  # (standing rule). The matrix jobs `needs:` this job, so on failure they are skipped and the
  # probe's message is the whole story.
  virt-probe:
    name: Virtualization probe
    runs-on: macos-15
    timeout-minutes: 2
    steps:
      - name: Probe nested virtualization availability
        run: |
          set -euo pipefail
          hv="$(sysctl -n kern.hv.supported 2>/dev/null || sysctl -n kern.hv_support 2>/dev/null || echo 0)"
          echo "kern.hv.supported=${hv}"
          if [ "${hv}" != "1" ]; then
            echo "::error::cider-5ve infrastructure: nested virtualization unavailable on this runner (kern.hv.supported=${hv}) — Cider E2E requires bare-metal Apple Silicon; Apple container VMs cannot boot here (VZErrorDomain Code=2). Failing fast instead of letting the matrix cascade red."
            exit 1
          fi
          echo "Hypervisor support present — runner can host Apple container VMs."

  e2e:
    name: E2E (${{ matrix.transport }})
    # Gated on the virtualization probe above (cider-5ve): skipped, not attempted, on runners
    # that cannot virtualize.
    needs: virt-probe
    # Apple Silicon, matching release.yml's build-sign-notarize job — the real Apple `container`
    # engine is arm64-only. GitHub's hosted macos-15 image does NOT support the nested
    # Virtualization.framework use that `container` needs (verified red: run 33053386488,
    # 2026-08-27) — the virt-probe job above reports that explicitly; a green run of this job
    # requires a runner on bare-metal Apple hardware.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Both transports must stay green (cider-ede.15) — CIDER_RUNTIME_TRANSPORT read by
        # DaemonFixture.Transport (tests/Cider.E2E.Tests/Infrastructure/DaemonFixture.cs) and passed
        # straight into the fixture's own in-process daemon.
        transport: [xpc, cli]
    env:
      CIDER_E2E: "1"
      CIDER_RUNTIME_TRANSPORT: ${{ matrix.transport }}
      # The newest apiserver release cider has been exercised against — keep this in lockstep with
      # ApiServerVersion.Tested (src/Cider.AppleContainer/Xpc/ApiServerVersion.cs). To characterize
      # the OLDER MINIMUM instead (ApiServerVersion.Minimum, currently 1.2.0), there is deliberately
      # no second CI job for it (installing a second, older signed .pkg side-by-side on the same
      # runner is not something `installer -pkg` supports cleanly) — run it locally instead:
      #   1. curl -fsSL -o container.pkg \
      #        https://github.com/apple/container/releases/download/1.2.0/container-1.2.0-installer-signed.pkg
      #   2. sudo installer -pkg container.pkg -target /
      #   3. container system start --enable-kernel-install
      #   4. CIDER_E2E=1 CIDER_RUNTIME_TRANSPORT=xpc dotnet test tests/Cider.E2E.Tests
      # (reinstalling the newest release afterwards restores your usual local setup).
      CIDER_CONTAINER_RELEASE: "1.3.0"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          show-progress: false

      - name: Install .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: |
            10.x
            11.0.100-preview.6.26359.118

      - name: Install docker CLI (client only — talks to cider's socket, no Docker daemon involved)
        run: brew install docker docker-buildx docker-compose

      - name: Install Apple container ${{ env.CIDER_CONTAINER_RELEASE }}
        run: |
          set -euo pipefail
          if command -v container >/dev/null 2>&1; then
            echo "container already present: $(container --version)"
          else
            curl -fsSL -o container.pkg \
              "https://github.com/apple/container/releases/download/${CIDER_CONTAINER_RELEASE}/container-${CIDER_CONTAINER_RELEASE}-installer-signed.pkg"
            sudo installer -pkg container.pkg -target /
          fi
          container --version

      - name: Start Apple container services
        # Mirrors AppleContainerRuntime.EnsureReadyAsync (docs/spikes/xpc/01-cider-runtime-map.md
        # `:98-123`): kernel install can take a while the first time a runner image sees it.
        run: container system start --enable-kernel-install
        timeout-minutes: 5

      - name: dotnet test (Cider.E2E.Tests, transport=${{ matrix.transport }})
        run: dotnet test tests/Cider.E2E.Tests -f net10.0 --filter "FullyQualifiedName!~PerfSmokeTests"
        timeout-minutes: 30

      # PerfSmokeTests (cider-ede.15) asserts latency budgets calibrated against a local developer
      # machine under real contention (see the class doc on PerfSmokeTests for the numbers and
      # conditions). As of the cider-ede.36 fixer re-correction (2026-08-27) that headroom is
      # roughly 1.4-2.2x over the worst outliers actually reproduced (28.4 ms median, 561.6 ms
      # 8-parallel wall, 134.2 ms p99 — the 8-parallel figure is the 19-run dataset's own maximum,
      # not just the 373.9 ms reviewer outlier), not the 2.5-8x this comment originally claimed —
      # still enough margin that this step gates the build like any other functional step.
      # It stays a separate step (its own
      # timeout) purely so a perf failure is distinguishable from a functional one in the job log. If
      # the first real macos-15 run can't meet a budget, widen that one number in PerfSmokeTests.cs
      # and record the runner measurement in the class doc — do not re-add continue-on-error here;
      # a widened budget plus a non-gating step is the same CI outcome as no test at all.
      - name: dotnet test (Cider.E2E.Tests PerfSmokeTests, transport=${{ matrix.transport }})
        run: dotnet test tests/Cider.E2E.Tests -f net10.0 --filter "FullyQualifiedName~PerfSmokeTests"
        timeout-minutes: 10

      - name: Stop Apple container services
        if: always()
        run: container system stop || true
