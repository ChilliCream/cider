name: E2E Large Context

run-name: E2E Large Context ${{ github.ref_name }}

# Deliberately NOT on pull_request/push (cider-ger.23): the 200 MiB build-context characterization
# is slow and needs a real Apple `container` runtime, so it runs on its own cadence rather than on
# every PR. This is the only leg that ever sets CIDER_E2E_LARGE=1 — without it,
# LargeContextFactAttribute (tests/Cider.E2E.Tests/Infrastructure/E2EFactAttribute.cs) always skips,
# which is exactly the gap this workflow closes: the sole regression guard on cider-ger.21's
# 8->32 MiB/s pacer retune (TokenBucketPacer.DefaultBytesPerSecond) and README.md's published
# "~6.2s at 32 MiB/s" figure was previously never exercised anywhere.
on:
  schedule:
    # 09:00 UTC every Monday — a known cadence rather than per-PR noise; a failure here is a real
    # regression signal on its own run, not something a PR author has to notice buried in a matrix.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

concurrency:
  group: e2e-large-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # cider-5ve: same fail-fast virtualization probe as e2e.yml — GitHub-hosted macos-15 runners
  # are VMs without nested virtualization, so Apple `container` can never boot a VM there
  # (VZErrorDomain Code=2). `sysctl -n kern.hv.supported` is the Apple Silicon
  # Hypervisor.framework capability sysctl (legacy alias kern.hv_support) that
  # Virtualization.framework depends on: 1 on bare-metal Apple Silicon (verified locally),
  # 0 inside non-nested runner VMs. Fails RED, never skip-green: a suite that cannot run is
  # not a pass (standing rule). The expensive job needs: this one, so the probe's message is
  # the whole story instead of a slow cascade.
  virt-probe:
    name: Virtualization probe
    runs-on: macos-15
    timeout-minutes: 2
    steps:
      - name: Probe nested virtualization availability
        run: |
          set -euo pipefail
          hv="$(sysctl -n kern.hv.supported 2>/dev/null || sysctl -n kern.hv_support 2>/dev/null || echo 0)"
          echo "kern.hv.supported=${hv}"
          if [ "${hv}" != "1" ]; then
            echo "::error::cider-5ve infrastructure: nested virtualization unavailable on this runner (kern.hv.supported=${hv}) — Cider E2E requires bare-metal Apple Silicon; Apple container VMs cannot boot here (VZErrorDomain Code=2). Failing fast instead of letting the matrix cascade red."
            exit 1
          fi
          echo "Hypervisor support present — runner can host Apple container VMs."

  e2e-large:
    name: E2E Large Context
    # Gated on the virtualization probe above (cider-5ve): skipped, not attempted, on runners
    # that cannot virtualize.
    needs: virt-probe
    # Apple Silicon — see e2e.yml's identical comment; the real Apple `container` engine is
    # arm64-only, and GitHub's hosted macos-15 runners do not support the nested
    # Virtualization.framework use `container` needs (see e2e.yml, cider-5ve).
    runs-on: macos-15
    env:
      CIDER_E2E: "1"
      CIDER_E2E_LARGE: "1"
      # Pinned to the newest apiserver release cider is exercised against, same as e2e.yml.
      CIDER_CONTAINER_RELEASE: "1.3.0"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          show-progress: false

      - name: Install .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: |
            10.x
            11.0.100-preview.6.26359.118

      - name: Install docker CLI (client only — talks to cider's socket, no Docker daemon involved)
        run: brew install docker docker-buildx docker-compose

      - name: Install Apple container ${{ env.CIDER_CONTAINER_RELEASE }}
        run: |
          set -euo pipefail
          if command -v container >/dev/null 2>&1; then
            echo "container already present: $(container --version)"
          else
            curl -fsSL -o container.pkg \
              "https://github.com/apple/container/releases/download/${CIDER_CONTAINER_RELEASE}/container-${CIDER_CONTAINER_RELEASE}-installer-signed.pkg"
            sudo installer -pkg container.pkg -target /
          fi
          container --version

      - name: Start Apple container services
        run: container system start --enable-kernel-install
        timeout-minutes: 5

      # Filtered to just the large-context characterization: this leg exists solely to run the one
      # test CIDER_E2E_LARGE gates, on net11.0 only (the shipped default TFM) — not to duplicate the
      # rest of the E2E suite that e2e.yml already runs per-PR.
      - name: dotnet test (Large_200mib_context_characterization)
        run: >
          dotnet test tests/Cider.E2E.Tests -f net11.0
          --filter "FullyQualifiedName~Large_200mib_context_characterization"
          --logger "console;verbosity=detailed"
        timeout-minutes: 20

      - name: Stop Apple container services
        if: always()
        run: container system stop || true
